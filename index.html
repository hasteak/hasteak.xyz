<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hasteak inside</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display&family=Rajdhani&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Rajdhani', sans-serif; /* base font */
            color: #fff;
            background-image: url('background02.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            overflow: hidden;
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2em;
            margin-bottom: 10px;
        }

        p {
            font-family: 'Playfair Display', serif;
            font-size: 1.5em;
            margin: 0;
            line-height: 1.5;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            body {
                padding: 10px;
                justify-content: flex-start;
            }

            h1 {
                font-size: 1.5em;
            }

            p {
                font-size: 1.2em;
                line-height: 1.3;
            }
        }
    </style>
</head>
<body>
    <h1>Welcome, whichever reason for being here you have.</h1>
    <p>Let strength be granted,<br>so the world might be mended.</p>
</body>
</html>
